name: Release binaries

# Builds release archives for every platform as workflow artifacts. Nothing is published
# from CI: scripts/publish-binaries.sh downloads the artifacts and uploads them to the
# GitHub release as the maintainer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, os: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-latest, os: darwin, arch: amd64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path Cargo.toml
      - name: Package
        run: |
          name="agent-sandbox_${{ inputs.tag }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "out/$name"
          cp "target/${{ matrix.target }}/release/agent-sandbox" LICENSE README.md "out/$name/"
          tar -C out -czf "out/$name.tar.gz" "$name"
          "out/$name/agent-sandbox" --version || true  # cross-built x86_64 on arm64 may not run
      - uses: actions/upload-artifact@v7
        with:
          name: agent-sandbox-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error
