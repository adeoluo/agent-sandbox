name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Report OS isolation support
        run: cargo run --quiet -- inspect --policy policies/coding-agent.toml

      - name: Test
        run: cargo test --all-targets -- --nocapture

      - name: Doc tests
        run: cargo test --doc

      - name: Latency percentiles (informational)
        run: cargo run --quiet --release --example latency 1000

  root-container:
    name: root in a container (${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # Root is exempt from RLIMIT_NPROC, so each container leaves exactly one way to
          # enforce limits.max_processes and the suite must report that it was the one used.
          - name: read-only cgroups, seccomp fork gate
            expect: forkgate
            docker: ""
            setup: "true"
          - name: delegated pids cgroup
            expect: cgroup
            docker: "--privileged --cgroupns=private"
            setup: "mkdir /sys/fs/cgroup/runner && echo $$ > /sys/fs/cgroup/runner/cgroup.procs && echo +pids > /sys/fs/cgroup/cgroup.subtree_control"
          - name: no cgroup and no seccomp listener, commands refused
            expect: refused
            docker: "--security-opt seccomp=ci/seccomp-no-listener.json"
            setup: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Test suite as uid 0
        env:
          SETUP: ${{ matrix.scenario.setup }}
        run: |
          docker run --rm ${{ matrix.scenario.docker }} \
            -v "$PWD":/src -w /src \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e AGENT_SANDBOX_EXPECT_PROCESS_CAP=${{ matrix.scenario.expect }} \
            -e SETUP \
            rust:1-slim sh -ec '
              apt-get update -qq && apt-get install -y -qq procps perl git >/dev/null
              test "$(id -u)" = 0
              eval "$SETUP"
              cargo test --all-targets -- --nocapture
            '

  coverage:
    name: coverage (ubuntu, gate 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --summary-only --fail-under-lines 85

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit
